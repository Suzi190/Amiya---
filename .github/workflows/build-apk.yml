name: Build Miya APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'mingruis-miya-main/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'mingruis-miya-main/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK directory not found at $SDK" >&2
            exit 1
          fi
          echo "Using Android SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Install platform 34 if missing
        run: |
          set -e
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMGR" ] && [ -x "$SDKMGR" ] && [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms" || true

      - name: Stage web assets
        run: |
          set -e
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -R mingruis-miya-main/. android/app/src/main/assets/public/
          rm -rf android/app/src/main/assets/public/.git
          ls android/app/src/main/assets/public | head -20

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin --console=plain

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log

      - name: Verify APK contents
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'assets/public/index.html'
          unzip -l "$APK" | grep -q 'assets/public/js2/miya-native-shell.js'
          unzip -l "$APK" | grep -q 'assets/public/css/style.css'
          echo "Web assets are bundled correctly"

      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/miya-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk out/miya.apk
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miya-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Miya APK 最新构建
          body: |
            自动构建（commit ${{ github.sha }}）

            手机直接点击下面的 **miya.apk** 下载安装，安装时允许「安装未知来源应用」即可。
          files: out/miya.apk
          fail_on_unmatched_files: true

      - name: Annotate build failure
        if: failure()
        run: |
          LOG=android/gradle-build.log
          if [ -f "$LOG" ]; then
            ERR=$(awk 'BEGIN{f=0} /FAILURE:|What went wrong|^E:|error:/{f=1} f' "$LOG" \
              | sed 's/\r$//' | grep -vE '^[[:space:]]+at ' | head -n 25)
            if [ -z "$ERR" ]; then
              ERR=$(tail -n 30 "$LOG" | sed 's/\r$//')
            fi
            printf '%s\n' "$ERR" | cut -c1-800 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done
          else
            echo "::error::gradle-build.log was not produced"
          fi
