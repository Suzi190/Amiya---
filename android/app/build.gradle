plugins {
    id 'com.android.application'
}

android {
    namespace 'com.miya.shell'
    compileSdk 34

    defaultConfig {
        applicationId 'com.miya.shell'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        resourceConfigurations += ['zh', 'en']
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 对齐 Kotlin 运行时版本，避免 androidx 传递的 kotlin-stdlib 与旧版
    // kotlin-stdlib-jdk7 / jdk8 产生 "Duplicate class" 打包失败
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}

configurations.configureEach {
    // Kotlin 1.8 起 jdk7/jdk8 的内容已合并进 kotlin-stdlib
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
